const RK='gs_demo_key';
const u8=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));

async function unlock(key){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(key),'PBKDF2',false,['deriveKey']);
  const aes=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u8(SALT),iterations:ITER,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(IV)},aes,u8(DATA));
  return new TextDecoder().decode(buf);
}
function show(html){ document.open(); document.write(html); document.close(); }

async function go(key,remember){
  const b=document.getElementById('b'), e=document.getElementById('e');
  b.disabled=true; b.textContent='驗證中…'; e.textContent='';
  try{
    const html=await unlock(key.trim());
    try{ remember?localStorage.setItem(RK,key.trim()):localStorage.removeItem(RK) }catch(_){}
    show(html);
  }catch(_){
    try{ localStorage.removeItem(RK) }catch(_){}
    b.disabled=false; b.textContent='進入'; e.textContent='金鑰不對，請再確認一次。';
  }
}
document.getElementById('f').onsubmit=ev=>{ev.preventDefault();go(document.getElementById('k').value,document.getElementById('r').checked)};
try{ const saved=localStorage.getItem(RK); if(saved) go(saved,true) }catch(_){}
</script>
